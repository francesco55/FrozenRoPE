[project]
name = "posext"
version = "0.1.0"
description = "Learning RoPE parameters on a frozen OLMo-2 for context extension (CS599 B1)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    # transformers is pinned exactly: posext/models/olmo2_posext.py is copied from this version.
    "transformers==4.57.1",
    # Contemporary with transformers 4.57.1. Linux wheels bundle CUDA 12.8.
    "torch==2.9.1",
    "accelerate>=1.11",
    "datasets>=4.2,<5",
    "numpy",
    "pyyaml",
    "wandb",
]

[project.optional-dependencies]
# Short-context benchmarks (eval/shortctx.py) and RQ4 LoRA (stub).
eval = ["lm-eval>=0.4.9"]
lora = ["peft>=0.18"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["posext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: uses the real OLMo-2 checkpoint (opt-in, set POSEXT_REAL_CKPT=1)",
    "network: downloads data (opt-in, set POSEXT_NETWORK=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Copied from transformers: keep upstream style so diffs against modeling_olmo2.py stay small.
"posext/models/olmo2_posext.py" = ["UP", "PLR0402", "RUF012", "E501"]
"tests/*" = ["C408"]
