# RQ1 follow-up: lr sweep, upper end.
# Same as configs/rq1/learned_freq_head.yaml except lr and init_from_yarn.
# Choose between runs by VALIDATION perplexity (posext.eval.ppl --split validation), not test.
name: rq1f_learned_freq_head_lr1e-1
seed: 0
model: allenai/OLMo-2-0425-1B
dtype: bfloat16
attn_implementation: sdpa
pos:
  mode: learned_freq
  granularity: head
  init_from_yarn: false
data:
  regime: long
  split: train
  seq_len: 16384
  target_len: 16384
  max_sequences: 100
  max_chunks_per_book: 1
train:
  steps: 500
  batch_size: 1
  lr: 1.0e-1
  weight_decay: 0.0
  grad_clip: 1.0
  clip_freq: 1.0
  logit_chunk_size: 2048
  log_every: 10
  save_every: 100
output_dir: outputs/rq1f_learned_freq_head_lr1e-1
wandb:
  enabled: false
  project: frozenrope
  run_name: rq1f_learned_freq_head_lr1e-1
